[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tabulite-mcp"
dynamic = ["version"]   # single source: src/tabulite_mcp/__init__.py
description = "Local MCP server that imports large CSV files into SQLite and exposes safe read-only SQL to a desktop AI client"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "David Guo" }]
keywords = ["mcp", "model-context-protocol", "sqlite", "csv", "data-analysis", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    # The official Python MCP SDK, pinned: this server targets the v2 API
    # (MCPServer, host/port on run()) and does not use v1 FastMCP patterns.
    "mcp==2.1.1",
    # Chart rendering. Used through the object-oriented Figure API on the Agg
    # backend, so there is no GUI toolkit and no global pyplot state; the lower
    # bound is where `layout="constrained"` and outside legend placement settle.
    "matplotlib>=3.8,<4",
]

[project.urls]
Homepage = "https://github.com/davidmrguo/tabulite-mcp"
Repository = "https://github.com/davidmrguo/tabulite-mcp"
Issues = "https://github.com/davidmrguo/tabulite-mcp/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.14"]

[project.scripts]
tabulite-mcp = "tabulite_mcp.server:main"

[tool.hatch.version]
path = "src/tabulite_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tabulite_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]   # "." so tests can import shared fixtures via tests.conftest
addopts = "-q"

[tool.ruff]
# Matches the code as written; the longest existing line is 113 characters.
line-length = 120

[tool.ruff.lint]
# Ruff's default rules: pyflakes (real defects - undefined names, unused
# imports, broken f-strings) plus the pycodestyle errors. Deliberately not the
# opinionated style families (import sorting, pyupgrade, flake8-bugbear); those
# are a separate decision from turning CI on, and would rewrite most of the tree.
select = ["E", "F"]
